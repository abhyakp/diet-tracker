<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page Not Found</title>
<style>
  :root { --bg:#f4f7f5; --text:#17231c; --muted:#5b6b62; --brand:#166534; --on:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0c140f; --text:#e6efe9; --muted:#9db0a4; --brand:#4ade80; --on:#06240f; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; text-align:center; }
  a { display:inline-block; margin-top:12px; background:var(--brand); color:var(--on); padding:12px 20px; border-radius:12px; text-decoration:none; font-weight:600; }
  p { color:var(--muted); }
</style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>This page does not exist.</p>
    <a href="./">Open Diet Tracker</a>
  </main>
</body>
</html>
